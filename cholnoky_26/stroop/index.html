<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stroop Task</title>

  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>

  <link
    href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css"
    rel="stylesheet"
  >

  <style>
    body {
      touch-action: manipulation;
    }

    .jspsych-btn {
      font-size: 1.5rem;
      padding: 18px 24px;
      margin: 10px;
      min-width: 100px;
    }
  </style>
</head>

<body></body>

<script>
  const jsPsych = initJsPsych({
    on_finish: function() {
      jsPsych.data.displayData();
    }
  });

  const trial = {
    type: jsPsychHtmlButtonResponse,

    stimulus: `
      <div style="
        font-size: 64px;
        font-weight: bold;
        color: red;
        margin-bottom: 40px;
      ">
        BLUE
      </div>
    `,

    choices: ["RED", "GREEN", "BLUE", "YELLOW"],

    data: {
      word: "BLUE",
      ink_color: "RED",
      correct_response: 0
    },

    on_finish: function(data) {
      data.correct = data.response === data.correct_response;
    }
  };

  jsPsych.run([trial]);
</script>
</html>
